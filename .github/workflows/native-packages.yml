name: Native packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: macos-universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev libdecor-0-dev

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCURL_NO_CURL_CMAKE=ON -DCURL_LIBRARY=/usr/lib/x86_64-linux-gnu/libcurl.so \
            -DCURL_INCLUDE_DIR=/usr/include/x86_64-linux-gnu

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCURL_NO_CURL_CMAKE=ON "-DCURL_LIBRARY=$sdk/usr/lib/libcurl.tbd" \
            "-DCURL_INCLUDE_DIR=$sdk/usr/include"

      - name: Build, test and stage
        run: |
          cmake --build build --config Release --parallel 3
          ctest --test-dir build --build-config Release --output-on-failure --no-tests=error
          cmake --install build --config Release --component Hub --prefix stage

      - name: Archive Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path stage/* -DestinationPath CyMCPHub-windows-x64.zip

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: tar -C stage -czf CyMCPHub-linux-x64.tar.gz .

      - name: Archive macOS
        if: runner.os == 'macOS'
        run: |
          lipo -verify_arch arm64 x86_64 stage/CyMCPHub.app/Contents/MacOS/CyMCPHub
          lipo -verify_arch arm64 x86_64 stage/CyMCPHub.app/Contents/MacOS/CyMCPHubMcp
          codesign --force --sign - stage/CyMCPHub.app/Contents/MacOS/CyMCPHubMcp
          codesign --force --sign - stage/CyMCPHub.app
          codesign --verify --deep --strict stage/CyMCPHub.app
          ditto -c -k --sequesterRsrc stage CyMCPHub-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CyMCPHub-${{ matrix.platform }}
          path: |
            CyMCPHub-${{ matrix.platform }}.zip
            CyMCPHub-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
