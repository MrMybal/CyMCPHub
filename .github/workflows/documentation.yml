name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '.CyDocBuild/**'
      - 'Documentation/**'
      - '.github/workflows/documentation.yml'
      - 'CMakeLists.txt'
      - 'src/hub_service.cpp'
  pull_request:
    paths:
      - '.CyDocBuild/**'
      - 'Documentation/**'
      - '.github/workflows/documentation.yml'
      - 'CMakeLists.txt'
      - 'src/hub_service.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - run: npm ci --prefix .CyDocBuild
      - run: npm --prefix .CyDocBuild run check
      - run: git diff --exit-code -- Documentation
